name: quality
on:
  push:
    branches: ["master"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r backend/requirements-dev.lock
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r backend/requirements-dev.lock
      - name: Recompile lockfiles and fail if they drifted
        run: |
          pip-compile --allow-unsafe --generate-hashes --no-strip-extras --output-file=backend/requirements.lock backend/requirements.txt
          pip-compile --allow-unsafe --generate-hashes --no-strip-extras --output-file=backend/requirements-dev.lock backend/requirements-dev.txt
          git diff --exit-code backend/requirements.lock backend/requirements-dev.lock
