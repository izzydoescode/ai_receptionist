name: container
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bear
          POSTGRES_PASSWORD: bear
          POSTGRES_DB: bear_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bear -d bear_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --pull -t bear:ci .
      - name: Write throwaway secrets (never printed)
        run: |
          umask 077
          python3 - > "$RUNNER_TEMP/bear.env" <<'PY'
          import secrets
          for name in ("TOOL_SECRET", "INIT_WEBHOOK_SECRET", "ADMIN_PASSWORD"):
              print(f"{name}={secrets.token_urlsafe(32)}")
          print("BEAR_MIGRATE_ON_BOOT=1")
          PY
      - name: Smoke-test with SQLite
        run: .github/scripts/container_smoke.sh bear-sqlite
      - name: Smoke-test with Postgres
        run: .github/scripts/container_smoke.sh bear-pg postgresql://bear:bear@localhost:5432/bear_test
      - name: Container logs on failure
        if: failure()
        run: |
          for name in bear-sqlite bear-pg; do
            docker logs "$name" 2>&1 | tail -50 || true
          done
