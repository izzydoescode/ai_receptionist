[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pg: needs a Postgres URL in BEAR_TEST_PG_URL (skipped otherwise)"]
pythonpath = ["backend", "tools", ".github/scripts"]
addopts = "-q"

[tool.coverage.run]
source = ["backend", "tools"]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["backend", "tools", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["bear", "main", "make_tools", "create_tools_via_api", "conftest", "test_logging"]

[tool.ruff.format]
quote-style = "double"
